# /etc/fail2ban/filter.d/dl.conf
# Caddy 의 JSON 로그에서 관리자·RAG 비밀번호 실패를 골라낸다.
#
# 공개 데모라 로그인 화면은 없지만, 관리 기능과 RAG 검색은 비밀번호로 잠겨
# 있다. 잠금 해제는 /api/v1/admin/unlock 한 곳을 지나므로 여기만 보면 된다.
# RAG 는 헤더로 비밀번호를 받아 실패 시 같은 401 을 낸다.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"/api/v1/admin/(unlock|verify)".*"status":401.*$
            ^.*"client_ip":"<HOST>".*"uri":"/api/v1/rag/search".*"status":401.*$
ignoreregex =
datepattern = "ts":{EPOCH}
