version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: dl-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: dl-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    # 한국어 형태소 분석기(nori)를 컨테이너 기동 시 자동 설치.
    # 이미 설치돼 있으면 그대로 통과하므로 재기동에도 안전(idempotent).
    command:
      - bash
      - -c
      - |
        bin/elasticsearch-plugin list | grep -q analysis-nori \
          || bin/elasticsearch-plugin install --batch analysis-nori
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
    volumes:
      - es_data:/usr/share/elasticsearch/data

  basex:
    image: basex/basexhttp:latest
    container_name: dl-basex
    restart: unless-stopped
    ports:
      - "8984:8984"
    # 이 이미지는 아래 환경변수를 무시하고 기본 계정(admin/admin)을 사용합니다.
    # 실제 비밀번호 변경은 컨테이너 내부에서 BaseX 명령(ALTER USER)으로 수행해야 합니다.
    environment:
      BASEX_USER: admin
      BASEX_PASSWORD: admin
    volumes:
      - basex_data:/srv/basex/data

  fuseki:
    image: stain/jena-fuseki:4.10.0
    container_name: dl-fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: 6BnTrOnSxWAXOZa5eN6bQEhl8K8v0Zbp
    # FUSEKI_DATASET 환경변수는 read-only 데이터셋을 만들기 때문에 사용하지 않음.
    # 데이터셋 생성과 update 서비스 활성화는 아래 command의 --update 플래그가 담당.
    command:
      - "--tdb2"
      - "--update"
      - "--loc=/fuseki/databases/digital-library"
      - "/digital-library"
    volumes:
      - fuseki_data:/fuseki

volumes:
  postgres_data:
  es_data:
  basex_data:
  fuseki_data:
